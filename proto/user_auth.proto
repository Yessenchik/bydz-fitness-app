syntax = "proto3";

package userauth.v1;

option go_package = "github.com/Yessenchik/bydz-fitness-app/user-auth-service/gen/userauth/v1;userauthv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// ─────────────────────────────────────────
//  Enums
// ─────────────────────────────────────────

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_CLIENT      = 1;
  ROLE_TRAINER     = 2;
  ROLE_ADMIN       = 3;
}

// ─────────────────────────────────────────
//  Shared messages
// ─────────────────────────────────────────

message UserProfile {
  string   user_id     = 1;
  string   email       = 2;
  string   first_name  = 3;
  string   last_name   = 4;
  string   phone       = 5;
  Role     role        = 6;
  bool     is_verified = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// ─────────────────────────────────────────
//  RPC request / response messages
// ─────────────────────────────────────────

// 1. Register
message RegisterRequest {
  string email      = 1;
  string password   = 2;
  string first_name = 3;
  string last_name  = 4;
  string phone      = 5;
}
message RegisterResponse {
  string      user_id = 1;
  string      message = 2; // "Verification email sent"
}

// 2. Login
message LoginRequest {
  string email    = 1;
  string password = 2;
}
message LoginResponse {
  string access_token  = 1;
  string refresh_token = 2;
  int64  expires_in    = 3; // seconds
  UserProfile user     = 4;
}

// 3. Logout
message LogoutRequest {
  string access_token = 1; // will be blacklisted in Redis
}
// response: google.protobuf.Empty

// 4. GetProfile
message GetProfileRequest {
  string user_id = 1;
}
// response: UserProfile

// 5. UpdateProfile
message UpdateProfileRequest {
  string user_id    = 1;
  string first_name = 2;
  string last_name  = 3;
  string phone      = 4;
}
// response: UserProfile

// 6. DeleteUser
message DeleteUserRequest {
  string user_id = 1;
}
// response: google.protobuf.Empty

// 7. ChangePassword
message ChangePasswordRequest {
  string user_id      = 1;
  string old_password = 2;
  string new_password = 3;
}
// response: google.protobuf.Empty

// 8. RequestPasswordReset
message RequestPasswordResetRequest {
  string email = 1;
}
// response: google.protobuf.Empty (sends email with token)

// 9. ConfirmPasswordReset
message ConfirmPasswordResetRequest {
  string reset_token   = 1;
  string new_password  = 2;
}
// response: google.protobuf.Empty

// 10. VerifyEmail
message VerifyEmailRequest {
  string verification_token = 1;
}
// response: google.protobuf.Empty

// 11. AssignRole
message AssignRoleRequest {
  string user_id = 1;
  Role   role    = 2;
}
// response: UserProfile

// 12. ListUsers  (admin-only, with pagination)
message ListUsersRequest {
  Role   filter_role = 1; // optional, 0 = all
  int32  page        = 2; // 1-based
  int32  page_size   = 3;
}
message ListUsersResponse {
  repeated UserProfile users       = 1;
  int32                total_count = 2;
  int32                page        = 3;
  int32                total_pages = 4;
}

// 13. RefreshToken  (bonus — сессионная логика)
message RefreshTokenRequest {
  string refresh_token = 1;
}
message RefreshTokenResponse {
  string access_token = 1;
  int64  expires_in   = 2;
}

// ─────────────────────────────────────────
//  Service definition
// ─────────────────────────────────────────

service UserAuthService {

  // Auth
  rpc Register            (RegisterRequest)            returns (RegisterResponse);
  rpc Login               (LoginRequest)               returns (LoginResponse);
  rpc Logout              (LogoutRequest)              returns (google.protobuf.Empty);
  rpc RefreshToken        (RefreshTokenRequest)        returns (RefreshTokenResponse);

  // Email flows
  rpc VerifyEmail         (VerifyEmailRequest)         returns (google.protobuf.Empty);
  rpc RequestPasswordReset(RequestPasswordResetRequest)returns (google.protobuf.Empty);
  rpc ConfirmPasswordReset(ConfirmPasswordResetRequest)returns (google.protobuf.Empty);

  // Profile management
  rpc GetProfile          (GetProfileRequest)          returns (UserProfile);
  rpc UpdateProfile       (UpdateProfileRequest)       returns (UserProfile);
  rpc ChangePassword      (ChangePasswordRequest)      returns (google.protobuf.Empty);
  rpc DeleteUser          (DeleteUserRequest)          returns (google.protobuf.Empty);

  // Admin
  rpc AssignRole          (AssignRoleRequest)          returns (UserProfile);
  rpc ListUsers           (ListUsersRequest)           returns (ListUsersResponse);
}