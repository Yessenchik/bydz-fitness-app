services:

  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile.dev
    container_name: bydz-auth-service
    restart: unless-stopped
    working_dir: /app/services/auth-service
    env_file:
      - ../.env.docker
    volumes:
      - ../services/auth-service:/app/services/auth-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      nats:
        condition: service_started
    ports:
    - "${AUTH_GRPC_EXTERNAL_PORT}:${AUTH_GRPC_PORT}"
    - "9101:9101"

  postgres:
    image: postgres:16-alpine
    container_name: bydz-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - bydz_pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bydz-redis
    restart: unless-stopped

    ports:
      - "${REDIS_EXTERNAL_PORT}:6379"

  nats:
    image: nats:2.10-alpine
    container_name: bydz-nats
    restart: unless-stopped

    command: ["-m", "8222"]

    ports:
      - "${NATS_PORT}:4222"
      - "8222:8222"

  prometheus:
    image: prom/prometheus:latest
    container_name: bydz-prometheus
    restart: unless-stopped

    ports:
      - "${PROMETHEUS_PORT}:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: bydz-grafana
    restart: unless-stopped

    ports:
      - "${GRAFANA_PORT}:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - bydz_grafana_data:/var/lib/grafana

  alertmanager:
    image: prom/alertmanager:latest
    container_name: bydz-alertmanager
    restart: unless-stopped

    ports:
      - "${ALERTMANAGER_PORT}:9093"

    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml

volumes:
  bydz_pg_data:
  bydz_grafana_data: